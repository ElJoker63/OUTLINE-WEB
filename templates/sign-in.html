<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Outline Web Manager - Secure Management Portal">
    <title>Outline Web Manager | Secure Sign-in</title>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.png">

    <!-- Hugeicons Web Font CDN -->
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/dist/css/liquid-glass.css">
  </head>
  <body>
    <!-- Ambient Background -->
    <div class="liquid-bg-container">
      <div class="liquid-orb orb-1"></div>
      <div class="liquid-orb orb-2"></div>
      <div class="liquid-orb orb-3"></div>
      <div class="liquid-orb orb-4"></div>
    </div>

    <!-- Centered Sign-in Viewport -->
    <div class="signin-viewport">
      <div class="signin-card">
        <!-- Brand Logo -->
        <div class="signin-logo-wrap">
          <img src="/static/images/outlinevpn.png" alt="Outline VPN Logo">
        </div>

        <div class="liquid-brand-badge mb-2" style="justify-content: center; margin-bottom: 12px;">
          <span class="liquid-pulse-dot"></span>
          <span>Encrypted Gateway</span>
        </div>

        <h1 class="signin-title">Outline Web Manager</h1>
        <p class="signin-subtitle">Connect your Outline Server by pasting your deployment JSON installation credentials below.</p>

        <form action="/sign-in" method="POST">
          <div style="margin-bottom: 20px;">
            <div class="liquid-input-group" style="padding: 6px;">
              <div class="liquid-input-icon">
                <i class="hgi-stroke hgi-key-01"></i>
              </div>
              <input 
                type="password" 
                class="liquid-input mono" 
                id="outputJsonForm" 
                name="outputJsonForm" 
                placeholder='{"apiUrl":"https://...","certSha256":"..."}'
                required 
                autocomplete="off"
                spellcheck="false"
              >
              <button type="button" class="liquid-btn liquid-btn-glass liquid-btn-icon sm" id="togglePasswordBtn" title="Toggle visibility" aria-label="Toggle password visibility">
                <i class="hgi-stroke hgi-view"></i>
              </button>
              <button type="button" class="liquid-btn liquid-btn-glass liquid-btn-sm" id="pasteJsonBtn" title="Paste from clipboard">
                <i class="hgi-stroke hgi-clipboard-copy"></i>
                <span>Paste</span>
              </button>
            </div>
          </div>

          <!-- Sample JSON reference box -->
          <div class="json-sample-box">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 600; color: #cbd5e1;">
              <span><i class="hgi-stroke hgi-code-circle sm" style="color: var(--accent-cyan); margin-right: 4px;"></i> Expected Format</span>
              <span style="font-size: 0.72rem; color: #64748b;">From Outline Install Script</span>
            </div>
            <code>{"apiUrl":"https://X.X.X.X:PORT/xxx","certSha256":"xxx"}</code>
          </div>

          <button class="liquid-btn liquid-btn-cyan w-100" type="submit" style="width: 100%; padding: 14px; font-size: 1rem; border-radius: 16px;">
            <span>Access Server Dashboard</span>
            <i class="hgi-stroke hgi-arrow-right-01"></i>
          </button>
        </form>

        <footer class="liquid-footer" style="padding-top: 24px; padding-bottom: 0;">
          <i class="hgi-stroke hgi-shield-check" style="color: var(--accent-emerald);"></i>
          <span>Encrypted Gateway &bull; Outline VPN Manager</span>
        </footer>
      </div>
    </div>

    <!-- Interactive Engine Script -->
    <script src="/static/dist/js/liquid-app.js"></script>
  </body>
</html>
