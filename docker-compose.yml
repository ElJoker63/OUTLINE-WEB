services:
  outline-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outline-web-manager
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/version"]
      interval: 30s
      timeout: 5s
      retries: 3
